<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>รถไฟสายสยาม</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2230;--navy2:#123447;--navy3:#1b4760;--cream:#fbf4e6;--paper:#fffaf1;--gold:#f6b93b;--gold2:#ffd56b;--ink:#1c2a32;--mute:#77858c;--line:#e8dcc5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Prompt,system-ui,sans-serif;background:var(--navy);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:14px;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
/* ---------- header ---------- */
header{background:linear-gradient(180deg,#0b2230,#0f2c3d);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;box-shadow:0 2px 10px #0006;z-index:3}
.toprow{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo .badge{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);box-shadow:0 2px 6px #0005}
.logo h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.logo h1 small{display:block;font-size:10px;font-weight:500;color:#9fb6c2;letter-spacing:.5px;margin-top:-2px}
.ibtn{width:36px;height:36px;border-radius:11px;border:1px solid #ffffff1a;background:#ffffff10;color:#dbe7ec;display:grid;place-items:center}
.ibtn:active{background:#ffffff25}
.ibtn svg{width:19px;height:19px}
#players{display:flex;gap:6px;margin-top:9px}
.pl{flex:1;min-width:0;background:#ffffff0d;border:1px solid #ffffff14;border-radius:12px;padding:6px 7px;position:relative;transition:.25s}
.pl.cur{background:linear-gradient(180deg,#ffffff22,#ffffff0d);border-color:var(--gold);box-shadow:0 0 0 2px #f6b93b33,0 4px 14px #0005}
.pl.cur::after{content:'';position:absolute;top:-5px;left:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 8px var(--gold)}
.pl .nm{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#e9f1f4;white-space:nowrap;overflow:hidden}
.av{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;box-shadow:inset 0 -2px 0 #0003,0 0 0 2px #ffffff30}
.pl .sc{font-size:19px;font-weight:800;color:#fff;line-height:1.1;margin-top:2px;display:flex;align-items:baseline;gap:3px}
.pl .sc span{font-size:9.5px;font-weight:500;color:#9fb6c2}
.pl .meta{display:flex;gap:7px;font-size:10px;color:#a9bfca;margin-top:1px}
.bar{height:4px;background:#ffffff18;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
/* ---------- map ---------- */
#mapBox{flex:1;position:relative;min-height:0}
#mapWrap{position:absolute;inset:0 0 -14px 0;overflow:hidden;background:#7fbcd6;touch-action:none;cursor:grab}
#mapWrap:active{cursor:grabbing}
#map{display:block;width:100%;height:100%}
html,body{touch-action:pan-x pan-y}
button,.card,.hc,.tk{touch-action:manipulation}
#hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#0b2230d0;color:#fff;font-size:11.5px;padding:6px 12px;border-radius:16px;z-index:2;pointer-events:none;transition:opacity .5s;white-space:nowrap}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:38px;height:38px;border-radius:12px;border:0;background:#fffffff0;box-shadow:0 2px 8px #0b223040;color:var(--navy);display:grid;place-items:center}
#zoom svg{width:18px;height:18px}
#final{position:absolute;left:10px;top:10px;background:linear-gradient(135deg,#e53935,#b71c1c);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;display:none;z-index:2;box-shadow:0 3px 10px #b71c1c66;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.route{cursor:pointer}
.route .car{transform-box:fill-box;transform-origin:center}
.route.new .car{animation:carIn .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes carIn{from{transform:scale(0);opacity:0}}
.city text{font-family:Prompt;font-size:10.5px;font-weight:600;paint-order:stroke;stroke:#fffaf1;stroke-width:3px;stroke-linejoin:round;fill:#1c2a32}
.city.big text{font-size:11.5px;font-weight:700}
.hlring{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{stroke-width:5px;opacity:.6}}
/* ---------- panel ---------- */
#panel{background:var(--paper);border-radius:18px 18px 0 0;margin-top:-14px;position:relative;z-index:3;box-shadow:0 -4px 18px #0b223035;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
#statusRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#status{flex:1;font-size:13px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:7px;min-width:0}
#status .pill{background:var(--navy);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:10px;flex:none}
#status .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:3px}.steps i{width:16px;height:5px;border-radius:3px;background:#d9cfbd}.steps i.on{background:var(--gold)}
#ticker{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);background:#f3ead8;border-radius:9px;padding:5px 9px;margin-bottom:9px;min-height:26px}
#ticker .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#ticker .d{width:8px;height:8px;border-radius:50%;flex:none}
.sec{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--mute);margin:0 2px 5px;letter-spacing:.3px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:6px}
/* cards */
.card{flex:1;min-width:0;aspect-ratio:.72;max-height:74px;border-radius:9px;position:relative;overflow:hidden;color:#fff;box-shadow:0 2px 0 #0002,0 3px 8px #0b223030;border:2.5px solid #fff;transition:transform .15s}
.card:active{transform:scale(.94)}
.card .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.card .face::before{content:'';position:absolute;inset:0;background:linear-gradient(155deg,#ffffff55 0%,#ffffff00 40%,#0000 60%,#00000025)}
.card .face::after{content:'';position:absolute;inset:3px;border:1px solid #ffffff60;border-radius:5px}
.card svg{width:52%;height:auto;position:relative;filter:drop-shadow(0 1px 1px #0004)}
.card .cn{position:relative;font-size:9.5px;font-weight:700;text-shadow:0 1px 2px #0006}
.card.dark-ink{color:#3a3a3a}.card.dark-ink .cn{text-shadow:none}
.card.empty{background:#efe6d4;border:2px dashed #d4c6ab;box-shadow:none}
.card.new{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.5) rotate(-8deg);opacity:0}}
.card.locked{filter:grayscale(.7) brightness(.85)}
.deck{background:var(--navy);background-image:radial-gradient(circle at 50% 40%,#1e5a78 0,transparent 60%),repeating-linear-gradient(45deg,#ffffff08 0 4px,transparent 4px 8px)}
.deck .face{color:var(--gold2)}
.deck .cnt{position:relative;font-size:15px;font-weight:800;color:#fff;line-height:1}
.deck .cn{color:#9fc0cf;font-size:8.5px}
.loco{background:conic-gradient(from 200deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.hand{margin-top:2px}
.hc{flex:1;min-width:0;height:44px;border-radius:8px;position:relative;box-shadow:0 2px 0 #0002;border:2px solid #fff;transition:.2s}
.hc::before{content:'';position:absolute;inset:0;border-radius:6px;background:linear-gradient(155deg,#ffffff50,#fff0 45%,#0000 60%,#0002)}
.hc .n{position:absolute;right:-5px;top:-7px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 3px #0005;border:1.5px solid #fff}
.hc.zero{opacity:.22;filter:grayscale(.3)}
.hc.zero .n{display:none}
.hc.stack{box-shadow:0 2px 0 #0002,3px -3px 0 -1px #fff,3px -3px 0 0 #0002}
.hc.bump{animation:bump .5s}
@keyframes bump{40%{transform:translateY(-6px) scale(1.08)}}
.hc svg{position:absolute;left:50%;top:50%;width:20px;transform:translate(-50%,-50%);color:#fff;opacity:.9;filter:drop-shadow(0 1px 1px #0004)}
.hc.dark-ink svg{color:#555}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:700;font-size:13.5px;background:linear-gradient(180deg,#1b4760,#0f2c3d);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 3px 0 #061722,0 4px 10px #0b223030;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #061722}
.btn.gold{background:linear-gradient(180deg,#ffd56b,#f6a823);color:var(--navy);box-shadow:0 3px 0 #c27c0e,0 4px 10px #f6b93b55}
.btn.ghost{background:#f1e7d4;color:var(--navy);box-shadow:0 3px 0 #d9c9aa}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px}
.btn .ct{background:#ffffff30;border-radius:8px;padding:0 6px;font-size:11px}
.btn.ghost .ct{background:#0b223018}
/* ---------- sheet ---------- */
#sheetBg{position:fixed;inset:0;background:#06131bb0;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;z-index:10;align-items:flex-end;justify-content:center}
#sheetBg.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{background:var(--paper);width:100%;max-width:520px;max-height:90dvh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60%)}}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d8ccb6;margin:0 auto 12px}
#sheet h2{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--navy)}
#sheet .sub{color:var(--mute);font-size:12.5px;margin:0 0 12px;line-height:1.5}
#sheet p{margin:6px 0;line-height:1.55}
/* ticket */
.tk{display:flex;align-items:stretch;margin:9px 0;border-radius:12px;background:#fff;box-shadow:0 2px 0 #e2d5bd,0 3px 10px #0b22301a;overflow:hidden;border:2px solid transparent;transition:.15s;position:relative}
.tk .main{flex:1;padding:10px 12px;min-width:0;background:linear-gradient(90deg,#fff,#fdf7ea)}
.tk .lab{font-size:9.5px;color:var(--mute);font-weight:600;letter-spacing:.6px}
.tk .rt{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;color:var(--navy);margin-top:1px}
.tk .rt svg{width:16px;color:var(--gold);flex:none}
.tk .stub{width:64px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed #fffaf1;position:relative}
.tk .stub b{font-size:20px;line-height:1}
.tk .stub small{font-size:9px;color:#9fc0cf}
.tk::before,.tk::after{content:'';position:absolute;right:57px;width:14px;height:14px;border-radius:50%;background:var(--paper);z-index:1}
.tk::before{top:-8px}.tk::after{bottom:-8px}
.tk.sel{border-color:var(--gold);box-shadow:0 0 0 3px #f6b93b40,0 3px 10px #0b22301a}
.tk .chk{width:22px;height:22px;border-radius:7px;border:2px solid #cfc2a8;display:grid;place-items:center;flex:none;margin-right:2px;color:#fff}
.tk.sel .chk{background:var(--gold);border-color:var(--gold)}
.tk.done .stub{background:#2e7d32}
.tk.sel .state::before{content:'🧭 กำลังแสดงบนแผนที่ — แตะอีกครั้งเพื่อยกเลิก';display:block;font-size:10.5px;color:#c27c0e;font-weight:700;margin-bottom:2px}
.tk.long .stub{background:linear-gradient(160deg,#f6a823,#c27c0e)}.tk.long .main{background:linear-gradient(90deg,#fff,#fff3d0)}
.tk.fail .stub{background:#b71c1c}
.tk .state{font-size:10.5px;font-weight:600;margin-top:3px}
.tk.done .state{color:#2e7d32}
/* pay options */
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rcars{display:flex;gap:3px}
.rcars i{width:22px;height:12px;border-radius:3px;border:1.5px solid #0003}
.chips{display:flex;gap:8px;margin:10px 0}
.chip{flex:1;background:#f3ead8;border-radius:11px;padding:7px 9px;text-align:center}
.chip b{display:block;font-size:17px;color:var(--navy)}
.chip small{font-size:10.5px;color:var(--mute)}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:#fff;border:2px solid var(--line);margin:8px 0;width:100%;text-align:left;font-weight:600;color:var(--navy);box-shadow:0 2px 0 var(--line)}
.opt:active{border-color:var(--gold)}
.opt .mini{display:flex;gap:2px}
.opt .mini i{width:13px;height:19px;border-radius:3px;border:1.5px solid #fff;box-shadow:0 0 0 1px #0002}
.opt .go{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:9px;padding:4px 10px;font-size:12px;font-weight:700}
.warn{background:#fdecea;color:#b71c1c;border-radius:11px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.5}
/* setup */
.hero{margin:-27px -18px 14px;padding:26px 18px 18px;background:radial-gradient(circle at 80% 0,#1e5a78,transparent 60%),linear-gradient(160deg,#0b2230,#123447);color:#fff;border-radius:22px 22px 0 0;position:relative;overflow:hidden}
.hero h2{color:#fff!important;font-size:26px!important}
.hero p{color:#b6cad3;margin:2px 0 0!important;font-size:13px}
.hero svg.train{position:absolute;right:-8px;bottom:-6px;width:170px;opacity:.95}
.seg{display:flex;gap:8px;margin:6px 0 14px}
.seg button{flex:1;padding:12px 6px;border-radius:13px;border:2px solid var(--line);background:#fff;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button small{font-size:10px;color:var(--mute);font-weight:500}
.seg button.on{border-color:var(--gold);background:#fff6df;box-shadow:0 0 0 3px #f6b93b33}
.lbl2{font-size:12px;font-weight:700;color:var(--navy);margin:4px 0}
.rules{list-style:none;padding:0;margin:6px 0}
.rules li{display:flex;gap:10px;margin:9px 0;line-height:1.5;font-size:13px}
.rules li .ic{width:28px;height:28px;border-radius:9px;background:#f3ead8;display:grid;place-items:center;flex:none;font-size:15px}
details{background:#f6eedd;border-radius:12px;padding:9px 12px}
summary{font-weight:600;color:var(--navy);font-size:13px}
/* results */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:14px 0 6px}
.pod{flex:1;max-width:110px;text-align:center}
.pod .av{width:38px;height:38px;font-size:18px;margin:0 auto 4px}
.pod .blk{border-radius:10px 10px 0 0;background:linear-gradient(180deg,#1b4760,#0f2c3d);color:#fff;padding:8px 4px;font-weight:800;font-size:18px}
.pod.p1 .blk{background:linear-gradient(180deg,#ffd56b,#f6a823);color:var(--navy);height:96px}
.pod.p2 .blk{height:72px}.pod.p3 .blk{height:56px}.pod.p4 .blk{height:44px}.pod.p5 .blk{height:36px}
#players.n5{gap:4px}#players.n5 .pl{padding:5px 5px}#players.n5 .pl .nm{font-size:10.5px}#players.n5 .pl .sc{font-size:16px}#players.n5 .pl .sc span{display:none}#players.n5 .pl .meta{gap:4px;font-size:9px}#players.n5 .av{width:15px;height:15px;font-size:9px}#players.n5 .you{display:none}
.seg button{min-width:0}
.pod .nm{font-size:12px;font-weight:600;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:10.5px;color:var(--mute);font-weight:600}
td:first-child,th:first-child{text-align:left}
.logl{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #efe5d2;font-size:12.5px;color:#46545b}
.logl .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
/* toast + banner + fly */
#toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:#0b2230f2;color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;font-weight:500;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 6px 20px #0005}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;pointer-events:none}
#banner .b{background:linear-gradient(135deg,#ffd56b,#f6a823);color:var(--navy);padding:16px 30px;border-radius:20px;text-align:center;box-shadow:0 12px 40px #0007;animation:bIn 1.5s ease both}
#banner .b b{display:block;font-size:24px;font-weight:800}
#banner .b span{font-size:12.5px;font-weight:500}
@keyframes bIn{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.04);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.flyer{position:fixed;z-index:40;border-radius:8px;border:2.5px solid #fff;box-shadow:0 8px 20px #0006;pointer-events:none;transition:all .55s cubic-bezier(.5,0,.3,1)}
/* start player */
#spin{position:fixed;inset:0;z-index:13;display:none;align-items:center;justify-content:center;background:#06131bcc;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px}
.spbox{background:var(--paper);border-radius:20px;padding:18px 16px;width:100%;max-width:360px;text-align:center;box-shadow:0 12px 40px #0008;animation:fade .25s}
.spbox h3{margin:0 0 12px;color:var(--navy);font-size:18px}
.splist{display:flex;flex-direction:column;gap:6px}
.sp{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;transition:transform .08s}
.sp .av{width:28px;height:28px;font-size:15px}
.sp b{color:var(--navy)}
.sp.on{border-color:var(--gold);background:#fff4d6;transform:scale(1.04);box-shadow:0 0 0 3px #f6b93b55}
.spres{min-height:46px;margin-top:12px;font-size:16px;color:var(--navy)}
.spres small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px}
.pickrow button{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-weight:600;color:var(--navy);font-size:12.5px}
.pickrow button.on{border-color:var(--gold);background:#fff4d6}
.seg.again button{font-size:18px;gap:2px}.seg.again b{font-size:12.5px}.seg.again small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v8 compact layout */
header{padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
.toprow{gap:6px}
#players{display:flex;gap:5px;flex:1;min-width:0;margin:0;overflow:visible}
.pc{flex:1;min-width:0;display:flex;align-items:center;gap:5px;background:#ffffff0f;border:1.5px solid #ffffff18;border-radius:11px;padding:4px 6px;color:#fff;position:relative;transition:.2s}
.pc.cur{border-color:var(--gold);background:#ffffff22;box-shadow:0 0 0 2px #f6b93b33}
.pc .av{width:22px;height:22px;font-size:12px;flex:none}
.pc .tx{min-width:0;line-height:1.15}
.pc .n1{font-size:10.5px;color:#cfe0e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pc .n2{font-size:13px;font-weight:800;white-space:nowrap}
.pc .n2 small{font-size:9.5px;font-weight:500;color:#9fb6c2;margin-left:3px}
.pc .bar2{position:absolute;left:6px;right:6px;bottom:2px;height:2px;border-radius:2px;background:#ffffff18;overflow:hidden}.pc .bar2 i{display:block;height:100%}
.pc.me .n1{color:var(--gold2)}

function ticketPlan(pi,id){const p=G.players[pi],t=TICKETS[id];

 return {rids,cost:r.cost,need,ok:r.cost<=p.trains,built,pct:Math.round(built/Math.max(1,built+r.cost)*100)}}

function playAgain(how){

 if(how==='next')first=(G.first+1)%n;else if(how==='loser')first=G.result?G.result[G.result.length-1].i:0;else first=Math.floor(Math.random()*n);

}

const Net={
 peer:null,conns:new Map(),conn:null,ok:false,code:'',lobby:[],seat:-1,timer:0,
 PFX:'siamrail-v1-',
 load(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);setTimeout(()=>rej(new Error('timeout')),12000)})},
 nm(){const n=(myName||'').trim();if(!n){toast('ใส่ชื่อของคุณก่อน');return null}return n.slice(0,12)},
 fail(msg){this.close();showSheet(`<h2>เชื่อมต่อไม่สำเร็จ</h2><div class="warn">${msg}</div><p class="sub">ถ้าเปิดเกมในหน้า Claude โหมดออนไลน์จะใช้ไม่ได้ ให้เปิดจากไฟล์เกมที่ฝากไว้บนเว็บ และลองใช้ Wi-Fi หรือเน็ตมือถือคนละเครือข่าย</p><button class="btn ghost" style="width:100%" onclick="tab='online';showSetup()">กลับ</button>`)},
 waiting(t){showSheet(`<h2>${t}</h2><div class="spin"></div><button class="btn ghost" style="width:100%" onclick="Net.close();tab='online';showSetup()">ยกเลิก</button>`,true)},
 close(){clearInterval(this.hb);try{this.conns.forEach((_,c)=>c.close())}catch(_){};try{this.conn&&this.ok&&this.conn.send({t:'bye'})}catch(_){};try{this.conn&&this.conn.close()}catch(_){};try{this.peer&&this.peer.destroy()}catch(_){}
  this.peer=null;this.conns=new Map();this.conn=null;this.ok=false;this.lobby=[]},
 newPeer(id){return new Promise((res,rej)=>{let done=false;const o=Object.assign({debug:0},window.SIAMRAIL_PEER||{});const p=id?new Peer(id,o):new Peer(o);
  const t=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'))}},12000);
  p.on('open',()=>{if(!done){done=true;clearTimeout(t);res(p)}});p.on('error',e=>{if(!done){done=true;clearTimeout(t);rej(e)}})})},
 // ---- host ----
 async host(opts){
  const sv=opts&&opts.resume;
  const n=sv?(sv.G.players[0].name):this.nm();if(!n)return;this.close();this.waiting(sv?'กำลังเปิดห้องเดิม…':'กำลังสร้างห้อง…');
  try{await this.load()}catch(e){return this.fail('โหลดระบบออนไลน์ไม่ได้')}
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(let tries=0;tries<6;tries++){
   const reuse=sv&&sv.code&&tries<3;
   const code=reuse?sv.code:Array.from({length:5},()=>A[Math.random()*A.length|0]).join('');
   try{this.peer=await this.newPeer(this.PFX+code);this.code=code;break}catch(e){if(e&&e.type==='unavailable-id'){if(reuse)await new Promise(r=>setTimeout(r,2500));continue}return this.fail('เชื่อมต่อเซิร์ฟเวอร์จับคู่ไม่ได้ ('+(e&&e.type||e.message)+')')}
  }
  if(!this.peer)return this.fail('สร้างห้องไม่สำเร็จ ลองใหม่อีกครั้ง');
  clearTimeout(aiTimer);aiTimer=null;MODE='host';ME=0;G=null;this.ok=true;
  this.lobby=[{name:n,kind:'host'}];
  this.peer.on('connection',c=>this.onConn(c));this.startHB();
  this.peer.on('disconnected',()=>{try{this.peer.reconnect()}catch(_){}});
  if(sv){
   G=sv.G;applyColors();this.timer=sv.timer||G.timer||0;
   G.players.forEach((p,i)=>{if(i>0&&!p.ai){p.off=true;p.ai=true}});
   log(`ห้องเปิดอีกครั้ง (${this.code}) — เพื่อนกลับเข้าห้องด้วยชื่อเดิมได้`);G.tkey='';
   resetTrackers();hideSheet();fitZoom();commit();
   showSheet(`<h2>ห้องกลับมาแล้ว</h2><p class="sub">${this.code===sv.code?'ใช้รหัสห้องเดิม':'รหัสเดิมยังไม่ว่าง จึงได้รหัสใหม่'} — ให้เพื่อนเข้าห้องด้วย<b>ชื่อเดิม</b> ระหว่างนี้บอทจะเล่นแทน</p><div class="codebox"><b>${this.code}</b><button class="btn ghost" onclick="copyTxt('${this.code}')">คัดลอก</button></div><button class="btn gold big" style="margin-top:12px" onclick="hideSheet()">เล่นต่อ</button>`);
   return;
  }
  this.showLobby();
 },
 seen:new Map(),hb:null,
 startHB(){clearInterval(this.hb);this.hb=setInterval(()=>{const now=Date.now();
  if(MODE==='host'){this.conns.forEach((seat,c)=>{if(now-(this.seen.get(c)||now)>12000)this.onLeave(c);else try{c.send({t:'pong'})}catch(_){}})}
  else if(MODE==='guest'&&this.conn){try{this.conn.send({t:'ping'})}catch(_){}if(this.ok&&now-(this.lastHost||now)>12000){this.ok=false;this.dropped()}}
 },3000)},
 onConn(c){
  this.seen.set(c,Date.now());
  c.on('data',d=>{this.seen.set(c,Date.now());this.onHostData(c,d)});
  c.on('close',()=>this.onLeave(c));c.on('error',()=>this.onLeave(c));
 },
 onHostData(c,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='ping')return;
  if(d.t==='bye')return this.onLeave(c);
  if(d.t==='hello'){
   const name=String(d.name||'เพื่อน').slice(0,12);
   if(G&&!G.over){ // rejoin a dropped seat with the same name (old connection may not have noticed yet)
    let i=G.players.findIndex(p=>p.off&&p.name===name);
    if(i<0){this.conns.forEach((seat,oc)=>{if(i<0&&oc!==c&&seat>=0&&G.players[seat].name===name){i=seat;this.conns.delete(oc);try{oc.close()}catch(_){}}})}
    if(i<0){c.send({t:'err',m:'เกมเริ่มไปแล้ว'});return setTimeout(()=>c.close(),300)}
    G.players[i].off=false;G.players[i].ai=false;this.conns.set(c,i);log(`${name} กลับเข้าเกมแล้ว`);c.send({t:'seat',seat:i});commit();return;
   }
   if(this.lobby.length>=5){c.send({t:'err',m:'ห้องเต็มแล้ว (5 คน)'});return setTimeout(()=>c.close(),300)}
   this.lobby.push({name,kind:'guest',c});this.conns.set(c,-1);this.sendLobby();this.showLobby();return;
  }
  if(d.t==='act'&&G){const seat=this.conns.get(c);if(seat==null||seat<0)return;if(G.players[seat].off){G.players[seat].off=false;G.players[seat].ai=false;log(`${G.players[seat].name} กลับมาแล้ว`)}const err=apply(seat,d.a);if(err)c.send({t:'err',m:err});commit()}
 },
 onLeave(c){
  if(!this.conns.has(c))return;const seat=this.conns.get(c);this.conns.delete(c);this.seen.delete(c);try{c.close()}catch(_){}
  if(G&&!G.over&&seat>=0){const p=G.players[seat];p.off=true;p.ai=true;if(G.pend[seat]){aiChooseTickets(seat,G.pend[seat].off,G.pend[seat].min);delete G.pend[seat];checkPickDone()}
   log(`${p.name} หลุดการเชื่อมต่อ — บอทเล่นแทนชั่วคราว`);toast(`${p.name} หลุดการเชื่อมต่อ`);commit();}
  else{this.lobby=this.lobby.filter(s=>s.c!==c);this.sendLobby();if(!G)this.showLobby()}
 },
 lobbyView(){return this.lobby.map(s=>({name:s.name,kind:s.kind}))},
 sendLobby(){const L=this.lobbyView();this.conns.forEach((_,c)=>{try{c.send({t:'lobby',lobby:L,code:this.code})}catch(_){}})},
 showLobby(){
  const link=/^https?:/.test(location.protocol)?location.href.split('#')[0]+'#join-'+this.code:'';
  showSheet(`<h2>ห้องของคุณ</h2><p class="sub">ส่งรหัสนี้ให้เพื่อน แล้วให้เพื่อนเปิดเกม เลือก "ออนไลน์" และกด "เข้าห้อง"</p>
  <div class="codebox"><b>${this.code}</b><button class="btn ghost" onclick="copyTxt('${this.code}')">คัดลอกรหัส</button></div>
  ${link?`<button class="btn ghost" style="width:100%;margin-top:8px" onclick="copyTxt('${link}')">🔗 คัดลอกลิงก์เชิญ</button>`:''}
  <div class="lbl2" style="margin-top:14px">ผู้เล่นในห้อง (${this.lobby.length}/5)</div>
  ${this.lobby.map((s,i)=>`<div class="seatrow"><span class="dot2" style="background:${PCOL[i]}"></span><span style="flex:1;font-weight:600">${esc(s.name)}</span>${s.kind==='bot'?`<button class="lv" onclick="Net.lobby[${i}].lvl=LVN[Net.lobby[${i}].lvl||'normal'];Net.sendLobby();Net.showLobby()">${LV[s.lvl||'normal']}</button>`:''}<span class="tag">${s.kind==='host'?'เจ้าของห้อง':s.kind==='bot'?'🤖 บอท':'😊 เพื่อน'}</span>${s.kind==='bot'?`<button class="x" onclick="Net.lobby.splice(${i},1);Net.sendLobby();Net.showLobby()">✕</button>`:''}</div>`).join('')}
  ${this.lobby.length<5?`<button class="btn ghost" style="width:100%;margin-top:6px" onclick="Net.lobby.push({name:'บอท '+(Net.lobby.filter(s=>s.kind==='bot').length+1),kind:'bot',lvl});Net.sendLobby();Net.showLobby()">＋ เพิ่มบอท</button>`:''}
  ${firstPicker(this.lobby.map(s=>s.name),'Net.showLobby()')}
  ${hintPicker('Net.showLobby()')}
  ${rcolPicker('Net.showLobby()')}
  <div class="lbl2" style="margin-top:14px">เวลาต่อตา</div><div class="seg">${[0,45,60,90].map(t=>`<button class="${this.timer===t?'on':''}" onclick="Net.timer=${t};Net.showLobby()">${t?t+' วิ':'ไม่จำกัด'}</button>`).join('')}</div>
  <button class="btn gold big" style="margin-top:4px" ${this.lobby.length<2?'disabled':''} onclick="Net.start()">🚂 เริ่มเกม (${this.lobby.length} คน)</button>
  <button class="btn ghost" style="width:100%;margin-top:8px" onclick="Net.close();MODE='local';tab='online';showSetup()">ปิดห้อง</button>`,true);
 },
 start(){
  if(this.lobby.length<2)return;
  makeGame(this.lobby.map(s=>({name:s.name,ai:s.kind==='bot',lvl:s.lvl})),resolveFirst(this.lobby.length),firstMode==='random'?'random':'pick');G.timer=this.timer;G.hints=hintPref;setRouteColors(rcolPref);
  this.lobby.forEach((s,i)=>{if(s.c){this.conns.set(s.c,i);try{s.c.send({t:'seat',seat:i})}catch(_){}}});
  ME=0;resetTrackers();lastTurnSeen=-1;hideSheet();fitZoom();commit();
 },
 restart(first,how){
  const seats=G.players.map((p,i)=>({name:p.name,ai:p.ai&&!p.off}));
  const connBySeat={};this.conns.forEach((s,c)=>{connBySeat[s]=c});
  const hz=G.hints;rcolPref=!!G.rcol;makeGame(seats.map((s,i)=>({name:s.name,ai:s.ai||(i>0&&!connBySeat[i]),lvl:G.players[i].lvl})),first,how);G.timer=this.timer;G.hints=hz;setRouteColors(rcolPref);
  resetTrackers();lastTurnSeen=-1;hideSheet();commit();
 },
 broadcastState(){if(!G)return;const s={t:'state',G};this.conns.forEach((seat,c)=>{if(seat>=0)try{c.send(s)}catch(_){}})},
 // ---- guest ----
 async join(code){
  const n=this.nm();if(!n)return;code=(code||'').toUpperCase().trim();if(code.length!==5)return toast('รหัสห้องมี 5 ตัว');
  this.close();this.waiting('กำลังเข้าห้อง '+code+'…');
  try{await this.load()}catch(e){return this.fail('โหลดระบบออนไลน์ไม่ได้')}
  try{this.peer=await this.newPeer()}catch(e){return this.fail('เชื่อมต่อเซิร์ฟเวอร์จับคู่ไม่ได้ ('+(e&&e.type||e.message)+')')}
  this.code=code;
  this.peer.on('error',e=>{if(e&&e.type==='peer-unavailable')this.fail('ไม่พบห้อง '+code+' — ตรวจรหัสอีกครั้ง หรือให้เพื่อนสร้างห้องใหม่')});
  const c=this.peer.connect(this.PFX+code,{reliable:true});this.conn=c;
  const to=setTimeout(()=>{if(!this.ok)this.fail('เชื่อมต่อกับห้องไม่ได้ (หมดเวลา)')},15000);
  c.on('open',()=>{clearTimeout(to);this.ok=true;this.lastHost=Date.now();this.startHB();clearTimeout(aiTimer);aiTimer=null;MODE='guest';G=null;c.send({t:'hello',name:n});this.guestLobby([])});
  c.on('data',d=>{this.lastHost=Date.now();this.onGuestData(d)});
  c.on('close',()=>{if(this.conn!==c)return;this.ok=false;this.dropped()});
 },
 dropped(){if(MODE!=='guest')return;const code=this.code;render();showSheet(`<h2>การเชื่อมต่อหลุด</h2><p class="sub">ขาดการติดต่อกับเจ้าของห้อง — ระหว่างนี้บอทจะเล่นแทนคุณ</p><button class="btn gold big" onclick="Net.join('${code}')">เชื่อมต่อใหม่</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="Net.close();MODE='local';tab='online';showSetup()">ออก</button>`,true)},
 guestLobby(L){
  showSheet(`<h2>ห้อง ${this.code}</h2><p class="sub">รอเจ้าของห้องเริ่มเกม…</p><div class="spin"></div>
  ${L.map((s,i)=>`<div class="seatrow"><span class="dot2" style="background:${PCOL[i]}"></span><span style="flex:1;font-weight:600">${esc(s.name)}</span><span class="tag">${s.kind==='host'?'เจ้าของห้อง':s.kind==='bot'?'🤖 บอท':'😊 เพื่อน'}</span></div>`).join('')}
  <button class="btn ghost" style="width:100%;margin-top:10px" onclick="Net.close();MODE='local';G=null;tab='online';showSetup()">ออกจากห้อง</button>`,true);
 },
 onGuestData(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='lobby'&&!G)this.guestLobby(d.lobby||[]);
  else if(d.t==='seat'){ME=d.seat;this.seat=d.seat}
  else if(d.t==='state'){const fresh=!G||G.gid!==d.G.gid;G=d.G;applyColors();if(G.sent)clockOff=Date.now()-G.sent;if(fresh){resetTrackers();lastTurnSeen=-1;hideSheet();fitZoom()}render();saveGame()}
  else if(d.t==='err')toast(d.m);
 },
 send(m){if(this.conn&&this.ok)try{this.conn.send(m)}catch(_){toast('ส่งข้อมูลไม่สำเร็จ')}else toast('ยังไม่ได้เชื่อมต่อ')}
};
window.addEventListener('pagehide',()=>{if(MODE==='guest'&&Net.conn&&Net.ok)try{Net.conn.send({t:'bye'})}catch(_){}});
function copyTxt(t){try{navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),()=>toast(t))}catch(_){toast(t)}}

window.addEventListener('resize',()=>{if(userZoom)setView();else fitZoom();renderSide()});
firstMode=store.get('firstMode','random');hintPref=store.get('hints','basic');rcolPref=store.get('rcol',false);Sfx.on=store.get('sound',true);sndIcon();lvl=store.get('lvl','normal');
fitZoom();render();
if(/^#join-[A-Z0-9]{5}$/.test(location.hash))tab='online';
showSetup();
</script>
</body>
</html>
